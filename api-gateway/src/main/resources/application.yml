server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # ---------- Auth Service (8081) ----------
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            # ---------- Vehicle Service (8082) ----------
            - id: vehicle-service
              uri: lb://vehicle-service
              predicates:
                - Path=/api/vehicles/**

            # ---------- Trip Service (8083) ----------
            - id: trip-service
              uri: lb://trip-service
              predicates:
                - Path=/api/trips/**

            # ---------- Maintenance Service (8084) ----------
            - id: maintenance-service
              uri: lb://maintenance-service
              predicates:
                - Path=/api/maintenance/**

            # ---------- OpenAPI documents ----------
            # Swagger UI at the gateway fetches each service's spec through these
            # routes, so everything stays behind one origin and one port.
            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/docs/auth/v3/api-docs
              filters:
                - RewritePath=/docs/auth/v3/api-docs, /v3/api-docs

            - id: vehicle-service-docs
              uri: lb://vehicle-service
              predicates:
                - Path=/docs/vehicles/v3/api-docs
              filters:
                - RewritePath=/docs/vehicles/v3/api-docs, /v3/api-docs

            - id: trip-service-docs
              uri: lb://trip-service
              predicates:
                - Path=/docs/trips/v3/api-docs
              filters:
                - RewritePath=/docs/trips/v3/api-docs, /v3/api-docs

            - id: maintenance-service-docs
              uri: lb://maintenance-service
              predicates:
                - Path=/docs/maintenance/v3/api-docs
              filters:
                - RewritePath=/docs/maintenance/v3/api-docs, /v3/api-docs

            # ---------- Health probes for the landing page ----------
            # Proxied through the gateway so the page can poll them same-origin.
            - id: auth-service-status
              uri: lb://auth-service
              predicates:
                - Path=/status/auth
              filters:
                - RewritePath=/status/auth, /actuator/health

            - id: vehicle-service-status
              uri: lb://vehicle-service
              predicates:
                - Path=/status/vehicles
              filters:
                - RewritePath=/status/vehicles, /actuator/health

            - id: trip-service-status
              uri: lb://trip-service
              predicates:
                - Path=/status/trips
              filters:
                - RewritePath=/status/trips, /actuator/health

            - id: maintenance-service-status
              uri: lb://maintenance-service
              predicates:
                - Path=/status/maintenance
              filters:
                - RewritePath=/status/maintenance, /actuator/health

            # The registry is not a Eureka client, so it is addressed directly.
            - id: eureka-server-status
              uri: http://${EUREKA_HOST:localhost}:8761
              predicates:
                - Path=/status/eureka
              filters:
                - RewritePath=/status/eureka, /actuator/health

# Aggregated Swagger UI: http://localhost:8080/swagger-ui.html
# The dropdown at the top switches between the four services.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: 1. Auth Service
        url: /docs/auth/v3/api-docs
      - name: 2. Vehicle Service
        url: /docs/vehicles/v3/api-docs
      - name: 3. Trip Service
        url: /docs/trips/v3/api-docs
      - name: 4. Maintenance Service
        url: /docs/maintenance/v3/api-docs
  # api-docs must stay enabled: springdoc gates its whole auto-configuration on
  # this flag, so turning it off also removes the Swagger UI. The gateway's own
  # (empty) document is simply not listed in the dropdown above.

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  # Must be the same Base64 key the auth-service signs with. Override via JWT_SECRET in every real environment.
  secret: ${JWT_SECRET}
  # Everything else requires a valid Bearer token.
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /actuator/**
    # Swagger UI and the OpenAPI documents behind it. The documents describe the
    # API only; every actual /api/** call from "Try it out" still needs a token.
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /docs/**
    # Project landing page and the health probes it polls.
    - /
    - /index.html
    - /favicon.ico
    - /status/**

# ---------- Edge hardening ----------
gateway:
  rate-limit:
    enabled: true
    requests-per-minute: ${RATE_LIMIT_RPM:120}
  cors:
    # Explicit allow-list, never "*": these endpoints carry bearer tokens.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
